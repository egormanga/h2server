[project]
name = 'h2server'
version = '0.2.0'
description = "Simple AsyncIO-based HTTP/2-only server protocol implementation"
authors = [{name = "Egor Vorontsov", email = "sdoregor@sdore.me"}]
license = 'AGPL-3.0-or-later'
requires-python = '~=3.11'
dependencies = ['h2 ~= 4.4.1']

[build-system]
requires = ['pdm-backend']
build-backend = 'pdm.backend'


[tool.pdm]
distribution = true
